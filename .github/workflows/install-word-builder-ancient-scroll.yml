name: Install approved Word Builder rules scroll
on:
  push:
    paths:
      - '.github/workflows/install-word-builder-ancient-scroll.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install scroll script without altering game logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="word-builder-ancient-scroll.js?v=live-1"></script>'
          if 'word-builder-ancient-scroll.js' not in s:
              if '</body>' not in s:
                  raise SystemExit('Missing closing body tag; refusing to modify')
              s=s.replace('</body>',tag+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit script reference if needed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Enable approved Word Builder rules scroll in live game"
            git push
          fi
