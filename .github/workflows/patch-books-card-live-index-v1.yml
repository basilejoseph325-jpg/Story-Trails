name: Patch independent Books card entry into LIVE candidate only
on:
  push:
    branches: [feature/bible-books-made-simple-release-20261114]
    paths:
      - '.github/scripts/patch_books_card_live_index_v1.py'
      - '.github/workflows/patch-books-card-live-index-v1.yml'
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate guarded patch
        run: |
          python3 -m py_compile .github/scripts/patch_books_card_live_index_v1.py
          node --check bible-books-made-simple-card-v1.js
      - name: Add exact standalone card loader to candidate HTML, not LIVE main
        shell: bash
        run: |
          set -euo pipefail
          branch=feature/bible-books-made-simple-release-20261114
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 .github/scripts/patch_books_card_live_index_v1.py
            python3 - <<'PY'
          from pathlib import Path
          import re
          raw=Path('index.html').read_text(encoding='utf-8')
          needle='<script id="bu-books-made-simple-live-v1" defer src="bible-books-made-simple-card-v1.js?v=20261114-live-books-v1"></script>'
          assert raw.count(needle)==1
          assert raw.count('id="home-story"')>=1
          assert raw.count('id="home-books"')>=1
          assert 'bu-books-direct-entry-v5' not in raw
          print('PASS: native game and independent Books card coexist')
          PY
            git add index.html
            if git diff --cached --quiet; then
              echo 'Already patched'
              exit 0
            fi
            git commit -m 'feat(LIVE candidate): direct homepage script for Books Made Simple'
            if git push origin HEAD:"$branch"; then
              echo 'PASS: safe index change committed to release branch only'
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to push because of concurrent changes; LIVE main untouched' >&2
          exit 1
