name: Reliable LIVE backup and restore (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'bu-platform-saves-v2.js'
      - 'index.html'
      - 'scripts/qa_issue13_*'
      - 'docs/ISSUE13_SAVE_SAFETY.md'
      - '.github/workflows/qa-issue13-save-safety.yml'
permissions:
  contents: read
jobs:
  safety:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      NODE_PATH: '${{ github.workspace }}/work/node_modules'
      BU_SHARED_WALLET_QA: '1'
      SAFETY_URL: http://127.0.0.1:8916/index.html
      STORY_URL: http://127.0.0.1:8916/index.html
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix work --no-audit --no-fund puppeteer-core@25.17.0 playwright@1.65.1
      - run: ./work/node_modules/.bin/playwright install --with-deps webkit
      - name: Syntax, restore/failure/recovery models, cached code and original-file scope
        run: |
          node --check bu-platform-saves-v2.js
          node scripts/qa_issue13_safety.cjs
          node scripts/qa_live_shared_wallet_scope.cjs
      - name: Private local server
        run: |
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          python3 -m http.server 8916 --bind 127.0.0.1 > work/http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8916/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chromium and WebKit mobile export/restore and resilience
        env:
          SAFETY_SHOTS: '1'
          SAFETY_EVIDENCE: work/issue13-browser-evidence.json
        run: |
          node scripts/qa_issue13_browser.cjs
          node scripts/qa_issue13_resilience.cjs
      - name: Existing LIVE Episode 12 gameplay regression
        run: node scripts/qa_genesis12_native.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue13-safety-evidence
          path: |
            work/issue13-browser-evidence.json
            work/issue13-review-*.png
          if-no-files-found: ignore
  chapter-candidate-compatibility:
    # Unmerged Genesis 13/14 is a separate release lane, not this wallet candidate.
    if: github.head_ref != 'feature/live-shared-wallet-single-tester-20261121' && github.ref_name != 'feature/live-shared-wallet-single-tester-20261121'
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      NODE_PATH: '${{ github.workspace }}/work/node_modules'
      STORY_URL: http://127.0.0.1:8917/index.html
      BU_WT_NATIVE_PARITY_URL: http://127.0.0.1:8917/index.html
      LIVE_BASELINE_URL: http://127.0.0.1:8918/index.html
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix work --no-audit --no-fund puppeteer-core@25.17.0
      - name: Combine the two reviewed candidates only in disposable QA files
        run: |
          git fetch origin 1e2f3636fb054497a4fae65a283401c2ad96e026
          COMBINED_DIR=work/combined BASELINE_DIR=work/baseline python3 scripts/qa_issue13_prepare_combined.py
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          python3 -m http.server 8918 --bind 127.0.0.1 --directory work/baseline > work/baseline-http.log 2>&1 &
          python3 -m http.server 8917 --bind 127.0.0.1 --directory work/combined > work/combined-http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8917/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Episode 13 all touch puzzles, hints, rewards and native 12/13/14 progression
        working-directory: work/combined
        env:
          STORY_EVIDENCE: work/combined-genesis13-evidence.json
        run: node scripts/qa_release_genesis13.cjs
      - name: Episode 14 all touch puzzles, hints, checkpoints and finale
        working-directory: work/combined
        env:
          STORY_EVIDENCE: work/combined-genesis14-evidence.json
        run: node scripts/qa_release_genesis14.cjs
      - name: Existing modes, audio, settings and saved-progress parity
        run: node scripts/qa_issue13_regression.cjs
      - name: Full Story regression and Word Trails/audio regression
        working-directory: work/combined
        run: |
          node scripts/qa_release_story_regression.cjs
          node scripts/qa_release_word_trails_audio.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue13-chapter-candidate-compatibility
          path: work/combined/work/combined-genesis*-evidence.json
          if-no-files-found: ignore
