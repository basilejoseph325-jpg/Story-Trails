name: QA LIVE candidate Bible Books Made Simple - Chrome
on:
  push:
    branches: [feature/bible-books-made-simple-release-20261114, main]
    paths:
      - 'bible-books-made-simple-card-v1.js'
      - 'bible-book-guides/**'
      - 'journey-progress-caption.js'
      - 'index.html'
      - 'scripts/qa_live_bible_books_card_v1.cjs'
      - '.github/workflows/qa-live-bible-books-card-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  chrome-player-path:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check bible-books-made-simple-card-v1.js
          node --check journey-progress-caption.js
          node --check bible-book-guides/books-v3.js
          node --check scripts/qa_live_bible_books_card_v1.cjs
      - name: Chrome portrait and landscape, home card and Bible reader
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-books-live-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/bu-books-live-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-books-live-qa/node_modules node scripts/qa_live_bible_books_card_v1.cjs
