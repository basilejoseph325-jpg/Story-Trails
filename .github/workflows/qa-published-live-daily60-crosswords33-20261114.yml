name: Verify actual published LIVE Daily60 Crosswords33 (read only)
on:
  push:
    branches:
      - release/daily60-crosswords33-no-editor-20261114
    paths:
      - '.github/workflows/qa-published-live-daily60-crosswords33-20261114.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  public-live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Validate test
        run: node --check scripts/qa_published_live_daily60_crosswords33_20261114.cjs
      - name: Verify real published LIVE in synthetic Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-public-live-qa puppeteer-core@24 --no-audit --no-fund --silent
          NODE_PATH=/tmp/bu-public-live-qa/node_modules node scripts/qa_published_live_daily60_crosswords33_20261114.cjs
