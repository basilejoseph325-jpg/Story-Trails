name: Assemble verified Genesis Episode 10 for LIVE candidate
on:
  push:
    branches: [release/genesis10-live-photos-hints-20261114]
    paths:
      - '.github/workflows/assemble-reviewed-genesis10-live-release.yml'
      - 'scripts/assemble_genesis10_selective_live_20261114.py'
permissions: {contents: write}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Build isolated LIVE candidate without modifying main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch='release/genesis10-live-photos-hints-20261114'
          for attempt in 1 2 3; do
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python3 -m py_compile scripts/assemble_genesis10_selective_live_20261114.py
            python3 scripts/assemble_genesis10_selective_live_20261114.py
            for p in bible_unfolded_core_part{1..5}.js; do node --check "$p"; done
            python3 - <<'PY'
          from pathlib import Path
          import re,json,subprocess
          body=''.join(json.loads(re.search(
            r'__BU_STAGE41_CORE_PARTS__\[\d+\] = (".*");',
            Path(f'bible_unfolded_core_part{i}.js').read_text(),re.S)[1]) for i in range(1,6))
          Path('/tmp/live-joined-story-native.js').write_text(body)
          subprocess.run(['node','--check','/tmp/live-joined-story-native.js'],check=True)
          assert body.count('const BU_EP10_SCENE_ART=Object.freeze(')==1
          assert body.count('Object.assign(BU_HQ_WORDS,{"g10-d01"')==1
          assert 'bible-unfolded-genesis-adventure-v3860' in body
          print('PASS assembled native Story JavaScript parses and retains original saves')
          PY
            git add index.html bible_unfolded_core_part3.js bible_unfolded_core_part5.js story-adventure-art/genesis10/
            git diff --cached --name-only
            python3 - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          expected={'index.html','bible_unfolded_core_part3.js','bible_unfolded_core_part5.js'}
          expected.update('story-adventure-art/genesis10/'+f for f in [
          'abraham-burial-promise.webp','rebekah-inquires-jehovah.webp','esau-and-jacob.webp',
          'esau-birthright-stew.webp','isaac-stays-gerar.webp','rehoboth-water-found.webp',
          'isaac-abimelech-covenant.webp','rebekah-goatskins-jacob.webp',
          'isaac-blessing-jacob.webp','jacob-stairway-dream.webp'])
          assert set(names)==expected,f'Unexpected staged asset set {sorted(set(names)^expected)}'
          print('PASS exact release-scope 13 files')
          PY
            git commit -m 'release candidate: Genesis Episode 10, 10 photos and thinking hints only'
            if git push origin "HEAD:$branch"; then
              echo "PASS release assembled on candidate only; LIVE main unchanged"
              exit 0
            fi
            sleep 3
          done
          echo 'Candidate branch moved concurrently; main untouched' >&2
          exit 1
