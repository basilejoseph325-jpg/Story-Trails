name: Promote verified native Trivia V2 into Story-Trails
on:
  push:
    paths:
      - '.github/workflows/promote-native-trivia-v2.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-trivia-promotion
  cancel-in-progress: false
jobs:
  install:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify hashes and install only index.html
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL=fc99808bc8afd336fef50701639058f47a64ed49
          FIXED=12d2f03d7818692ceb33f39b627e0a842984fa43
          CURRENT=$(git hash-object index.html)
          if [[ "$CURRENT" == "$FIXED" ]]; then
            echo 'Native Trivia is already installed.'
            exit 0
          fi
          if [[ "$CURRENT" != "$ORIGINAL" ]]; then
            echo "Source mismatch: refusing to replace modified index ($CURRENT)" >&2
            exit 1
          fi
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
            'https://raw.githubusercontent.com/basilejoseph325-jpg/Bible-Unfolded-Visual-Lab/main/index.html' \
            --output /tmp/verified-native-trivia.html
          RECEIVED=$(git hash-object /tmp/verified-native-trivia.html)
          if [[ "$RECEIVED" != "$FIXED" ]]; then
            echo "Destination integrity check failed ($RECEIVED)" >&2
            exit 1
          fi
          cp /tmp/verified-native-trivia.html index.html
          git add index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Promote verified native Trivia V2 screen to production'
          git push origin HEAD:main
