name: QA candidate only - retire Word Trails silent TEST import
on:
  push:
    branches: [release/word-trails-retire-silent-import-20261114]
    paths: ['.github/workflows/qa-word-trails-silent-import-retirement-candidate.yml']
permissions: {contents: read}
jobs:
  isolated-native-crossword:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate untouched original LIVE game and exact two-file safety change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git diff --name-only origin/main HEAD
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--name-only','origin/main','HEAD'],text=True).splitlines()
          assert set(changed)=={'.github/workflows/qa-word-trails-silent-import-retirement-candidate.yml','experiments/word-trails-next-v1.html','experiments/word-trails-live-migration-v1.js'},changed
          html=open('experiments/word-trails-next-v1.html').read()
          old=subprocess.check_output(['git','show','origin/main:experiments/word-trails-next-v1.html'],text=True)
          tag='<script src="word-trails-live-migration-v1.js?v=live-progress-only-20261109" defer></script>\n'
          assert old.count(tag)==1 and html==old.replace(tag,'')
          assert 'word-trails-live-migration-v1.js' not in html
          assert 'word-trails-next-v1.js' in html
          assert 'word-trails-levels-12-30-v1.js' in html
          oldjs=subprocess.check_output(['git','show','origin/main:experiments/word-trails-live-migration-v1.js'],text=True)
          assert 'localStorage.setItem(LIVE,' in oldjs
          shim=open('experiments/word-trails-live-migration-v1.js').read()
          assert 'BUWTLegacyAutoImportRetiredV6' in shim
          assert 'localStorage' not in shim and 'sessionStorage' not in shim
          for f in ['bible_unfolded_core_part1.js','bible_unfolded_core_part2.js','bible_unfolded_core_part3.js','bible_unfolded_core_part4.js','bible_unfolded_core_part5.js','index.html','bu-platform-saves-v2.js']:
            assert not subprocess.check_output(['git','diff','origin/main','HEAD','--',f]),f
          print('PASS_WT_RETIRED_IMPORT_EXACT_TWO_FILE_DELTA: all other LIVE game and save managers unchanged')
          PY
          node --check experiments/word-trails-live-migration-v1.js
          node --check experiments/word-trails-next-v1.js
          mkdir -p /tmp/wt-stage
          git show origin/main:experiments/word-trails-next-v1.html >/tmp/wt-stage/old-html.html
          git show origin/main:experiments/word-trails-live-migration-v1.js >/tmp/wt-stage/old-importer.js
      - name: Test fresh, cached HTML, cached old JS and existing LIVE saves on 2 mobile Chrome viewports
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/wt-retirement-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8897 --bind 127.0.0.1 >/tmp/wt-retire-http.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/wt-retirement-qa/node_modules node <<'JS'
          'use strict';
          const assert=require('node:assert/strict');
          const {readFileSync}=require('node:fs');
          const {execSync}=require('node:child_process');
          const puppeteer=require('puppeteer-core');
          const oldHtml=readFileSync('/tmp/wt-stage/old-html.html','utf8');
          const oldJs=readFileSync('/tmp/wt-stage/old-importer.js','utf8');
          const TEST='bu-visual-lab-wordtrails-next-v1',LIVE='bible-unfolded-word-trails-next-v1';
          const WALLET='bible-unfolded-rewards-v17',WHEELS='bible-unfolded-wheel-ownership-v3825-backup',VOICE='bible-unfolded-private-voice-pref-v381';
          const source=JSON.stringify({level:2,unlocked:5,coins:9999,points:500,completed:[0,1,2],
            sparks:[0],claimedSparks:['0:ABEL'],boardBible:[],paidWords:[],paidBonuses:[],
            claimedFreeHints:[0],sound:true,progress:null});
          const existing=JSON.stringify({level:1,unlocked:5,coins:137,points:42,completed:[0,1],
            sparks:[],claimedSparks:[],boardBible:[],paidWords:[],paidBonuses:[],claimedFreeHints:[],
            sound:true,progress:null,ownerSavedMarker:'existing-live-must-survive'});
          const wallet='{"coins":741,"points":38,"purchases":["seawheel"]}',wheels='{"owned":["seawheel"]}',voice='{"mode":"rotate","volume":60}';
          (async()=>{
          const browser=await puppeteer.launch({headless:true,
            executablePath:execSync('command -v google-chrome || command -v chromium',{encoding:'utf8'}).trim(),
            args:['--no-sandbox','--disable-setuid-sandbox','--disable-dev-shm-usage'],protocolTimeout:120000});
          try{
            for(const [width,height] of [[390,705],[320,568]]){
              for(const scenario of ['fresh','cached-html-fresh-js','cached-html-cached-js','existing-live']){
                const context=await browser.createBrowserContext();
                try{
                  const page=await context.newPage(),errors=[];
                  page.on('pageerror',e=>errors.push(e.message));
                  await page.setViewport({width,height,deviceScaleFactor:2,isMobile:true,hasTouch:true});
                  await page.evaluateOnNewDocument((data)=>{
                    localStorage.setItem(data.TEST,data.source);
                    localStorage.setItem(data.WALLET,data.wallet);
                    localStorage.setItem(data.WHEELS,data.wheels);
                    localStorage.setItem(data.VOICE,data.voice);
                    if(data.existing)localStorage.setItem(data.LIVE,data.existing);
                    else localStorage.removeItem(data.LIVE);
                  },{TEST,LIVE,WALLET,WHEELS,VOICE,source,wallet,wheels,voice,
                     existing:scenario==='existing-live'?existing:null});
                  if(scenario.startsWith('cached-html')||scenario==='existing-live'){
                    await page.setRequestInterception(true);
                    page.on('request',r=>{
                      if(r.url().includes('/word-trails-next-v1.html')){
                        r.respond({status:200,contentType:'text/html',body:oldHtml}).catch(()=>{});
                      }else if(scenario==='cached-html-cached-js'&&r.url().includes('/word-trails-live-migration-v1.js')){
                        r.respond({status:200,contentType:'application/javascript',body:oldJs}).catch(()=>{});
                      }else r.continue().catch(()=>{});
                    });
                  }
                  const response=await page.goto('http://127.0.0.1:8897/experiments/word-trails-next-v1.html',
                    {waitUntil:'domcontentloaded',timeout:115000});
                  assert.equal(response.status(),200);
                  await page.waitForFunction(()=>document.querySelectorAll('.wheel-letter').length>=6,
                    {timeout:45000});
                  const state=await page.evaluate(({TEST,LIVE,WALLET,WHEELS,VOICE})=>{
                    const l=localStorage.getItem(LIVE),t=localStorage.getItem(TEST);
                    return {live:l?JSON.parse(l):null,rawLive:l,rawTest:t,
                     wallet:localStorage.getItem(WALLET),wheels:localStorage.getItem(WHEELS),
                     voice:localStorage.getItem(VOICE),
                     retired:window.BUWTLegacyAutoImportRetiredV6?.disabled??false,
                     wheelLetters:document.querySelectorAll('.wheel-letter').length};
                  },{TEST,LIVE,WALLET,WHEELS,VOICE});
                  assert.equal(state.rawTest,source,'TEST source must not be overwritten');
                  assert.equal(state.wallet,wallet,'real native wallet untouched');
                  assert.equal(state.wheels,wheels,'owned Ocean Glow untouched');
                  assert.equal(state.voice,voice,'announcer preference untouched');
                  assert.equal(errors.length,0,'Browser errors: '+errors.join('|'));
                  if(scenario==='cached-html-cached-js'){
                    assert.equal(state.live?.migration?.version,1,
                      'Old cached importer still causes unconsented transfer: must not misrepresent risk');
                    assert.deepEqual(state.live?.completed,[0,1,2]);
                  }else if(scenario==='existing-live'){
                    assert.equal(state.rawLive,existing,'Preserve an existing LIVE save exactly');
                    assert(state.retired,'Cached HTML should now fetch inert compatibility JS');
                  }else{
                    assert.deepEqual(state.live?.completed,[],
                      'Neither fresh HTML nor refetched old HTML may steal TEST progress');
                    assert.equal(state.live?.migration,undefined,'No imported provenance');
                    assert.equal(state.live?.coins,60,'Real Word Trails new-game coins unchanged');
                    if(scenario==='cached-html-fresh-js')assert(state.retired,'Old cached HTML should fetch inert shim');
                    else assert(!state.retired,'Fresh HTML should never request old migration file');
                  }
                  console.log('PASS_WT_NO_SILENT_IMPORT_CANDIDATE',JSON.stringify({
                    scenario,viewport:width+'x'+height,level:state.live?.level,
                    previousCompleted:state.live?.completed?.length,
                    cachedOldJsStillUnsafe:scenario==='cached-html-cached-js',
                    existingSaveUnchanged:scenario==='existing-live',
                    nativeWalletAndPurchasedWheelsUnchanged:true}));
                }finally{await context.close();}
              }
            }
          }finally{await browser.close()}
          console.log('PASS_WT_NO_SILENT_IMPORT_8_MOBILE_SCENARIOS');
          })().catch(e=>{console.error('FAIL_WT_NO_SILENT_IMPORT',e.stack||e);process.exitCode=1});
          JS
