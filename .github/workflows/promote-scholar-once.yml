name: One-time Scholar Research native promotion
on:
  push:
    paths:
      - '.github/workflows/promote-scholar-once.yml'
permissions:
  contents: write
jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transfer approved Scholar screen and images
        shell: bash
        run: |
          git clone --depth 1 --quiet https://github.com/basilejoseph325-jpg/Bible-Unfolded-Visual-Lab.git .scholar-approved-source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import subprocess
          import shutil
          
          source = Path("index.html")
          baseline = source.read_bytes()
          git_sha = hashlib.sha1(b"blob " + str(len(baseline)).encode() + b"\0" + baseline).hexdigest()
          assert git_sha == "8a955afba2e9cf56af769f161b42aa89ffaac3ad", "Unexpected production index; abort"
          src = baseline.decode("utf-8")
          lab = Path(".scholar-approved-source")
          fragment = (lab / "scholar-native-fragment.txt").read_text(encoding="utf-8")
          css = (lab / "scholar-native.css").read_text(encoding="utf-8")
          start_marker = '  const esc=ctx.esc();\n  e.innerHTML=' + chr(96) + '<div class="bu3835-tracks">'
          end_marker = "e.scrollTop=0;"
          start = src.find(start_marker)
          end = src.find(end_marker, start)
          assert start >= 0 and end > start and end - start < 2000
          assert src.count(start_marker) == 1 and src.count("</head>") == 1
          assert "buScholarVisual" in fragment and "ctx.setTrack(b.dataset.track);ctx.pick()" in fragment
          assert "ctx.home()" in fragment and "data-scholar-filter" in fragment
          assert len(re.findall(r"^\s+'[^']+':\[", fragment, flags=re.M)) == 11
          assert "buScholarThumb:after" in css
          art = ["hero", "joshua-jericho", "prophecies-uncovered", "witness-history", "ultimate-challenge", "heroes-of-courage", "hidden-bible-details", "big-bible-questions", "courage-and-faith", "bible-surprises", "surprise-me", "warm-up"]
          for slug in art:
              f = lab / "scholar-research-assets" / (slug + ".webp")
              assert f.is_file() and f.stat().st_size > 3000, "Missing approved art: " + slug
          assert src.count("bible_unfolded_core_part5.js") == 1
          patched = src[:start] + fragment + src[end + len(end_marker):]
          patched = patched.replace("</head>", '<style id="bu-scholar-illustrated-production-style">\n' + css + '\n</style></head>', 1)
          assert patched.count("bu3835-tracks buScholarVisual") == 1
          assert patched.count("bu-scholar-illustrated-production-style") == 1
          assert patched.count("bible_unfolded_core_part5.js") == 1
          script_start = patched.rfind("<script", 0, start)
          script_body = patched.find(">", script_start) + 1
          script_end = patched.find("</script>", script_body)
          assert script_start >= 0 and script_body > script_start and script_end > start
          Path("/tmp/bu-scholar-validate.js").write_text(patched[script_body:script_end], encoding="utf-8")
          subprocess.run(["node", "--check", "/tmp/bu-scholar-validate.js"], check=True)
          source.write_text(patched, encoding="utf-8")
          dest = Path("scholar-research-assets")
          dest.mkdir(exist_ok=True)
          for slug in art:
              shutil.copy2(lab / "scholar-research-assets" / (slug + ".webp"), dest / (slug + ".webp"))
          print("PASS: native Scholar replaced, artwork=12, 11 paths preserved, JS syntax checked")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f index.html scholar-research-assets
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m 'Promote approved Scholar Research illustrations natively'
          git push origin HEAD:main
