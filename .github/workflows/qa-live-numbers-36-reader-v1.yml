name: QA LIVE Numbers 36 chapters and preserved reading progress
on:
  push:
    branches: [feature/numbers-36-reading-guide-live-20261114, main]
    paths:
      - 'bible-book-guides/**'
      - 'scripts/qa_live_numbers_36_reader_v1.cjs'
      - '.github/workflows/qa-live-numbers-36-reader-v1.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate JS, official links and manuscript
        run: |
          node --check bible-book-guides/books-v3.js
          node --check scripts/qa_live_numbers_36_reader_v1.cjs
          python3 -m json.tool bible-book-guides/numbers-draft.json >/dev/null
      - name: Browser QA — 390x844, 320x680, 844x390, resume, finish, reader refresh
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-live-numbers-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8899 --bind 127.0.0.1 >/tmp/bu-live-numbers.log 2>&1 &
          sleep 2
          NODE_PATH=/tmp/bu-live-numbers-qa/node_modules node scripts/qa_live_numbers_36_reader_v1.cjs
