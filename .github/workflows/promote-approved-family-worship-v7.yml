name: Promote owner-approved Family Worship gallery V7 to live
on:
  push:
    paths:
      - '.github/workflows/promote-approved-family-worship-v7.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: promote-approved-family-worship-v7-live
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout original live game, without replacing its core
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Copy SHA-verified isolated Family Worship artwork and component files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.request import Request, urlopen
          from urllib.parse import quote
          from urllib.error import HTTPError, URLError
          import hashlib, time
          base="https://raw.githubusercontent.com/basilejoseph325-jpg/Bible-Unfolded-Visual-Lab/8a4eef54fbe538ee74bc512e2e53b5b8eba08dae/"
          manifest="""\
