          5a3c45d1b2b520a14b36de4f7fcb827dbd983170  family-worship-menu-art/v1/topic-41-job-integrity.webp
          caf4df8b40dd1be2763f1f9c5e5302aef7c45510  family-worship-menu-art/v1/topic-42-christian-living.webp
          7dd1a1c9d3391faec53b8359c4b31a5c9fb67901  family-worship-menu-art/v1/level-beginner.webp
          d2c0ce5e92f3499fcbde06cc61618c0a222e7a8b  family-worship-menu-art/v1/level-intermediate.webp
          7b29544e535e8d338ca252eba7196592a96af992  family-worship-menu-art/v1/level-advanced.webp
          036412ae39a8807a474375fc6523e9abfb62b27a  family-worship-menu-art/v1/level-expert.webp
          """
          entries=[]
          for line in manifest.splitlines():
              line=line.strip()
              if not line:continue
              sha,path=line.split(maxsplit=1)
              assert len(sha)==40 and path.startswith(("family-worship-menu-art/","family-worship-")), (sha,path)
              entries.append((sha,path))
          assert len(entries)==52 and len(set(p for _,p in entries))==52
          assert sum(p.startswith("family-worship-menu-art/") for _,p in entries)==46
          def verify(data,expected,path):
              blobhash=hashlib.sha1(b"blob "+str(len(data)).encode()+b"\\0"+data).hexdigest()
              if blobhash!=expected:raise ValueError("Content SHA mismatch for "+path)
          def download(item):
              sha,path=item
              dst=Path(path)
              if dst.exists():
                  data=dst.read_bytes()
                  verify(data,sha,path)
                  return path,len(data),"existing"
              url=base+quote(path,safe="/")
              for retry in range(4):
                  try:
                      req=Request(url,headers={"User-Agent":"BibleUnfolded-Live-FamilyWorship-VerifiedPromotion"})
                      with urlopen(req,timeout=45) as response:
                          data=response.read()
                      verify(data,sha,path)
                      if path.endswith((".jpg",".webp",".png")):
                          assert len(data)>5000,("Suspiciously small art",path)
                      dst.parent.mkdir(parents=True,exist_ok=True)
                      dst.write_bytes(data)
                      return path,len(data),"copied"
                  except Exception:
                      if retry==3:raise
                      time.sleep(retry+1)
              raise AssertionError(path)
          with ThreadPoolExecutor(max_workers=6) as pool:
              futures=[pool.submit(download,item) for item in entries]
              for f in as_completed(futures):
                  path,size,mode=f.result()
                  print("COPY",mode,path,size,flush=True)
          gallery=Path("family-worship-picker-gallery-v3.js").read_text()
          import re
          referenced=set(re.findall(r"family-worship-menu-art/[^\"'\x60\\s)]+?\\.(?:jpg|webp|png)",gallery))
          declared={p for _,p in entries if p.startswith("family-worship-menu-art/")}
          assert referenced==declared,(sorted(referenced-declared),sorted(declared-referenced))
          assert "topic-08-cain-and-abel.jpg" in gallery
          assert "topic-10-tower-of-babel.jpg" in gallery
          assert "topic-19-elisha.jpg" in gallery
          assert "topic-27-samuel.jpg" in gallery
          assert "topic-38-jesus-ministry.webp" in gallery
          assert gallery.count("family-worship-menu-art/")==46
          original=Path("journey-progress-caption.js")
          previous=original.read_text()
          assert "trivia-wrong-tone-repair-v1.js?v=20261106-live-approved-rich-negative-v5" in previous
          assert "bu-fw-gathering-css-v1" not in previous or "bu-fw-gallery-v3-js" in previous
