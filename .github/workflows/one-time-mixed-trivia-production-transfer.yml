name: One-time verified Mixed Trivia V2 production transfer
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-mixed-trivia-production-transfer.yml'
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify production and transfer only the approved Trivia page
        shell: bash
        run: |
          set -euo pipefail
          ORIGINAL='12d2f03d7818692ceb33f39b627e0a842984fa43'
          APPROVED='6fb36ef473461cd88ea3a444f27951ce368a2bb5'
          current="$(git hash-object index.html)"
          if [ "$current" = "$APPROVED" ]; then
            echo 'Approved Mixed Trivia already present; nothing to do.'
            exit 0
          fi
          if [ "$current" != "$ORIGINAL" ]; then
            echo "::error::Production index changed; refusing to overwrite."
            exit 1
          fi
          curl --fail --location --retry 4 --retry-all-errors --output /tmp/bible-approved-mixed-trivia.html 'https://raw.githubusercontent.com/basilejoseph325-jpg/Bible-Unfolded-Visual-Lab/9b743a08623ffc482e183c00cc19fff3f1d039ef/index.html'
          test "$(git hash-object /tmp/bible-approved-mixed-trivia.html)" = "$APPROVED" || { echo 'Source fingerprint mismatch'; exit 1; }
          cp /tmp/bible-approved-mixed-trivia.html index.html
          git add -- index.html
          git config user.name 'Bible Unfolded Verified Integration'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Promote approved Mixed Trivia V2 to production (preserve gameplay and core assets)'
          git push origin HEAD:main
