name: QA LIVE Genesis Episode 10 selective release (all 10 photos and hints)
on:
  push:
    branches: [release/genesis10-live-photos-hints-20261114]
    paths:
      - 'index.html'
      - 'bible_unfolded_core_part3.js'
      - 'bible_unfolded_core_part5.js'
      - 'story-adventure-art/genesis10/**'
      - '.github/workflows/qa-genesis10-live-candidate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  verified-native-story:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Assert protected original game data and asset manifest preserved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin backup-before-genesis10-live-20261114 --depth=1
          for i in 1 2 4; do
            name="bible_unfolded_core_part${i}.js"
            test "$(git hash-object "$name")" = "$(git rev-parse "FETCH_HEAD:$name")"
          done
          test "$(git hash-object bu-platform-saves-v2.js)" = "$(git rev-parse 'FETCH_HEAD:bu-platform-saves-v2.js')"
          test ! -f story-adventure-explore-launcher-test-v1.js
          test ! -f experiments/story-adventure-nehemiah-explore-v1.html
          test "$(find story-adventure-art/genesis10 -maxdepth 1 -name '*.webp' | wc -l)" -eq 10
          grep -q 'live-genesis10-story-and-hints-20261114-v1' index.html
          grep -q 'live-genesis10-all10-scenes-20261114-v1' index.html
          for p in bible_unfolded_core_part{1..5}.js; do node --check "$p"; done
          echo 'PASS original engine and save files untouched except scoped native Story extensions'
      - name: Import frozen, exact validated TEST player-path verification scripts
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/basilejoseph325-jpg/Bible-Unfolded-Visual-Lab/171a599c42ab89030d34b7552779ee427586f319'
          mkdir -p scripts story-adventure-content
          for script in qa_genesis10_all10_images_player_test_v1.cjs qa_genesis10_quality_photo_hints_v1.cjs qa_genesis10_real_word_wheel_20261114.cjs; do
            curl --fail --retry 3 -sSL "$base/scripts/$script" -o "scripts/$script"
            node --check "scripts/$script"
          done
          curl --fail --retry 3 -sSL "$base/story-adventure-content/genesis-episode10-wordwheel-test-v1.json" -o story-adventure-content/genesis-episode10-wordwheel-test-v1.json
          echo 'PASS pinned 10-scene, clues, hints and real-word-wheel QA imported to ephemeral runner'
      - name: Test real mobile Chrome gameplay, photo pixels, thinking hints and saved progress
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bu-genesis10-live-candidate-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8893 --bind 127.0.0.1 >/tmp/bu-genesis10-live-8893.log 2>&1 &
          python3 -m http.server 8896 --bind 127.0.0.1 >/tmp/bu-genesis10-live-8896.log 2>&1 &
          sleep 2
          export NODE_PATH=/tmp/bu-genesis10-live-candidate-qa/node_modules
          node scripts/qa_genesis10_all10_images_player_test_v1.cjs
          node scripts/qa_genesis10_quality_photo_hints_v1.cjs
          node scripts/qa_genesis10_real_word_wheel_20261114.cjs
          echo 'PASS LIVE release candidate: all 10 images, 3 thinking hints, 10 actual answers, resume and original saves'
