name: Enable Bible Word Challenges cinematic cards
on:
  push:
    paths:
      - '.github/workflows/install-bible-word-challenges-live.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add isolated cinematic card enhancement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="bible-word-challenges-visual.js?v=live-1"></script>'
          if 'bible-word-challenges-visual.js' in s:
              s=re.sub(r'bible-word-challenges-visual\\.js\\?v=[^"\\s<]+', 'bible-word-challenges-visual.js?v=live-1', s)
          else:
              if '</body>' not in s: raise SystemExit('No closing body tag; refusing edit')
              s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Enable approved Bible Word Challenges cinematic cards"
            git push
          fi
