name: One-time approved Trivia topic promotion
on:
  push:
    paths:
      - '.github/workflows/promote-approved-topic-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Validate base and import exact Visual Lab build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "6fb36ef473461cd88ea3a444f27951ce368a2bb5"
          curl --fail --location --retry 3 --silent --show-error             'https://raw.githubusercontent.com/basilejoseph325-jpg/Bible-Unfolded-Visual-Lab/287a8a1197f5623540fc12efa19a1f810933f137/index.html'             --output "$RUNNER_TEMP/approved-index.html"
          test "$(git hash-object "$RUNNER_TEMP/approved-index.html")" = "8a955afba2e9cf56af769f161b42aa89ffaac3ad"
          cp "$RUNNER_TEMP/approved-index.html" index.html
          git add -- index.html
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Promote tested illustrated Choose a Topic screen to production"
          git push origin HEAD:main
