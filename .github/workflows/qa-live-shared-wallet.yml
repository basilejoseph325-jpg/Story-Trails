name: LIVE shared wallet (candidate only)
on:
  pull_request:
    branches: [main]
    paths:
      - 'live-*.js'
      - 'index.html'
      - 'journey-progress-caption.js'
      - 'word-trails-live-bootstrap-v1.js'
      - 'bu-platform-saves-v2.js'
      - 'bu-platform-rewards-v1.js'
      - 'word-trails-native-shell-v1.js'
      - 'experiments/word-trails-*'
      - 'scripts/qa_live_shared_wallet*'
      - '.github/workflows/qa-live-shared-wallet.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          node scripts/qa_live_shared_wallet_scope.cjs
          node scripts/qa_live_shared_wallet_model.cjs
          BU_SHARED_WALLET_QA=1 node scripts/qa_issue13_safety.cjs
  browsers:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    env:
      NODE_PATH: '${{ github.workspace }}/work/node_modules'
      WALLET_ENGINES: '${{ matrix.engine }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --prefix work --no-audit --no-fund playwright@1.65.1
      - run: ./work/node_modules/.bin/playwright install --with-deps ${{ matrix.engine }}
      - name: Private candidate server
        run: |
          echo "CHROME_BIN=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"
          python3 -m http.server 8921 --bind 127.0.0.1 > work/http.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8921/index.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: node scripts/qa_live_shared_wallet_browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-wallet-${{ matrix.engine }}
          path: work/live-shared-wallet/
