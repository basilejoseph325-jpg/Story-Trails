name: Word Trails LIVE staged release gate
on:
  push:
    branches:
      - 'release/word-trails-next-30-safe-20261109'
    paths:
      - '.github/workflows/qa-word-trails-live-release.yml'
      - 'scripts/word_trails_live_release_qa.cjs'
      - 'experiments/word-trails-*'
      - 'word-trails-*.js'
      - 'word-trails-live-bootstrap-v1.js'
      - 'bu-platform-*.js'
      - 'journey-progress-caption.js'
permissions: {contents: read}
jobs:
  full-game-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and LIVE protection checks
        run: |
          set -euo pipefail
          for f in scripts/word_trails_live_release_qa.cjs word-trails-native-shell-v1.js word-trails-next-launcher.js word-trails-live-bootstrap-v1.js bu-platform-rewards-v1.js bu-platform-saves-v2.js experiments/word-trails-next-v1.js experiments/word-trails-live-migration-v1.js experiments/word-trails-feel-v2.js experiments/word-trails-announcer-v1.js experiments/word-trails-native-wheel-v1.js experiments/word-trails-main-settings-v1.js experiments/word-trails-unified-menu-v1.js; do node --check "$f"; done
          python3 - <<'PY'
          from pathlib import Path
          root=Path('journey-progress-caption.js').read_text()
          game=Path('experiments/word-trails-next-v1.js').read_text()
          html=Path('experiments/word-trails-next-v1.html').read_text()
          assert "bu-wt-live-bootstrap" in root
          assert "bible-unfolded-word-trails-next-v1" in game
          assert "const STORAGE='bu-visual-lab-wordtrails-next-v1'" not in game
          assert "visual-lab-test-banner.js" not in root
          assert "word-trails-original-voice-clips-v1.js" not in html
          assert "word-trails-live-migration-v1.js" in html
          assert "TEST" not in html.split('<body>')[1].split('</body>')[0]
          PY
      - name: Mobile-browser real Word Trails and original game regression
        run: |
          set -euo pipefail
          npm install --prefix /tmp/bible-live-qa puppeteer-core@24 --no-audit --no-fund --silent
          python3 -m http.server 8912 --bind 127.0.0.1 >/tmp/bu-live-qa-http.log 2>&1 &
          sleep 1
          NODE_PATH=/tmp/bible-live-qa/node_modules node scripts/word_trails_live_release_qa.cjs